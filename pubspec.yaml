name: mp3_player
description: A beautiful offline music player for iOS and Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^9.1.0
  equatable: ^2.0.5
  get_it: ^8.0.3

  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  audio_session: ^0.1.21

  file_picker: 8.1.2
  path_provider: ^2.1.4
  path: ^1.9.0

  shared_preferences: ^2.3.3
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
